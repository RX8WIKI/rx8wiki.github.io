<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="warningGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e67e22;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Dashboard hint -->
  <rect x="50" y="100" width="300" height="200" rx="20" fill="#34495e" opacity="0.5"/>
  <rect x="70" y="120" width="260" height="160" rx="15" fill="#1a252f"/>
  
  <!-- Check Engine Light (large, glowing) -->
  <g transform="translate(150, 160)" filter="url(#glow)">
    <path d="M0 0 L60 -35 L120 0 L120 50 L0 50 Z" fill="#f39c12" opacity="0.3"/>
    <path d="M5 5 L55 -28 L115 5 L115 45 L5 45 Z" fill="#f39c12" opacity="0.5"/>
    <path d="M10 10 L50 -22 L110 10 L110 40 L10 40 Z" fill="#f1c40f"/>
    <text x="60" y="25" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2c3e50">CHECK</text>
    <text x="60" y="38" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2c3e50">ENGINE</text>
  </g>
  
  <!-- OBD connector -->
  <g transform="translate(200, 280)">
    <rect x="0" y="0" width="80" height="50" rx="5" fill="#7f8c8d"/>
    <circle cx="20" cy="15" r="5" fill="#2c3e50"/>
    <circle cx="40" cy="15" r="5" fill="#2c3e50"/>
    <circle cx="60" cy="15" r="5" fill="#2c3e50"/>
    <circle cx="20" cy="35" r="5" fill="#2c3e50"/>
    <circle cx="40" cy="35" r="5" fill="#2c3e50"/>
    <circle cx="60" cy="35" r="5" fill="#2c3e50"/>
    <text x="40" y="48" text-anchor="middle" font-family="Arial" font-size="8" fill="#bdc3c7">OBD-II</text>
  </g>
  
  <!-- Text -->
  <text x="450" y="100" font-family="Arial" font-size="42" font-weight="bold" fill="#ecf0f1">CHECK ENGINE</text>
  <text x="450" y="145" font-family="Arial" font-size="22" fill="#bdc3c7">Коды неисправностей</text>
  
  <!-- Error codes table -->
  <g transform="translate(450, 180)">
    <!-- Header -->
    <rect x="0" y="0" width="300" height="35" rx="5" fill="#34495e"/>
    <text x="50" y="23" font-family="Arial" font-size="14" font-weight="bold" fill="#ecf0f1">КОД</text>
    <text x="150" y="23" font-family="Arial" font-size="14" font-weight="bold" fill="#ecf0f1">ОПИСАНИЕ</text>
    
    <!-- Row 1 -->
    <rect x="0" y="40" width="300" height="30" rx="3" fill="#3498db" opacity="0.3"/>
    <text x="50" y="60" font-family="Arial" font-size="12" font-weight="bold" fill="#3498db">P0300</text>
    <text x="150" y="60" font-family="Arial" font-size="12" fill="#bdc3c7">Пропуски зажигания</text>
    
    <!-- Row 2 -->
    <rect x="0" y="75" width="300" height="30" rx="3" fill="#e74c3c" opacity="0.3"/>
    <text x="50" y="95" font-family="Arial" font-size="12" font-weight="bold" fill="#e74c3c">P0171</text>
    <text x="150" y="95" font-family="Arial" font-size="12" fill="#bdc3c7">Бедная смесь</text>
    
    <!-- Row 3 -->
    <rect x="0" y="110" width="300" height="30" rx="3" fill="#f39c12" opacity="0.3"/>
    <text x="50" y="130" font-family="Arial" font-size="12" font-weight="bold" fill="#f39c12">P0420</text>
    <text x="150" y="130" font-family="Arial" font-size="12" fill="#bdc3c7">Катализатор</text>
    
    <!-- Row 4 -->
    <rect x="0" y="145" width="300" height="30" rx="3" fill="#9b59b6" opacity="0.3"/>
    <text x="50" y="165" font-family="Arial" font-size="12" font-weight="bold" fill="#9b59b6">P0101</text>
    <text x="150" y="165" font-family="Arial" font-size="12" fill="#bdc3c7">Датчик MAF</text>
  </g>
  
  <!-- Scanner icon -->
  <g transform="translate(680, 280)">
    <rect x="0" y="0" width="70" height="90" rx="8" fill="#2c3e50"/>
    <rect x="10" y="10" width="50" height="50" rx="3" fill="#3498db"/>
    <text x="35" y="35" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff">SCAN</text>
    <circle cx="35" cy="75" r="8" fill="#e74c3c"/>
    <line x1="30" y1="75" x2="40" y2="75" stroke="#fff" stroke-width="2"/>
  </g>
</svg>
