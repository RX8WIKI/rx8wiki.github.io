<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Text -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="42" font-weight="bold" fill="#ecf0f1">АКСЕССУАРЫ</text>
  <text x="400" y="80" text-anchor="middle" font-family="Arial" font-size="18" fill="#bdc3c7">Оригинальные аксессуары Mazda</text>
  
  <!-- Car outline with accessory highlights -->
  <g transform="translate(50, 120)">
    <!-- Car body -->
    <path d="M20 80 L40 50 L80 40 L200 40 L240 50 L280 80 L280 120 L20 120 Z" fill="#34495e" stroke="#4a5568" stroke-width="2"/>
    
    <!-- Windows -->
    <path d="M50 55 L85 45 L140 45 L180 55 L180 75 L50 75 Z" fill="#2c3e50"/>
    
    <!-- Wheels -->
    <circle cx="70" cy="120" r="25" fill="#2c3e50" stroke="#7f8c8d" stroke-width="3"/>
    <circle cx="70" cy="120" r="12" fill="#7f8c8d"/>
    <circle cx="230" cy="120" r="25" fill="#2c3e50" stroke="#7f8c8d" stroke-width="3"/>
    <circle cx="230" cy="120" r="12" fill="#7f8c8d"/>
    
    <!-- Spoiler highlight -->
    <path d="M240 48 L270 45 L280 55 L240 55 Z" fill="#e74c3c" opacity="0.8"/>
    <line x1="260" y1="50" x2="300" y2="30" stroke="#e74c3c" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="310" y="30" font-family="Arial" font-size="11" fill="#e74c3c">Спойлер</text>
    
    <!-- Headlights -->
    <ellipse cx="280" cy="70" rx="8" ry="12" fill="#f39c12" opacity="0.8"/>
    
    <!-- Side mirror -->
    <ellipse cx="45" cy="65" rx="8" ry="10" fill="#4a5568"/>
    
    <!-- Door handles -->
    <rect x="100" y="70" width="15" height="8" rx="3" fill="#7f8c8d"/>
    <rect x="160" y="70" width="15" height="8" rx="3" fill="#7f8c8d"/>
    
    <!-- Roof (sunroof hint) -->
    <rect x="100" y="42" width="60" height="8" rx="2" fill="#3498db" opacity="0.6"/>
    <line x1="130" y1="45" x2="130" y2="60" stroke="#3498db" stroke-width="2" stroke-dasharray="3,3"/>
    <text x="130" y="75" text-anchor="middle" font-family="Arial" font-size="9" fill="#3498db">Люк</text>
  </g>
  
  <!-- Accessories grid -->
  <g transform="translate(400, 120)">
    <!-- Row 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="80" height="60" rx="8" fill="#e74c3c"/>
      <text x="40" y="25" text-anchor="middle" font-family="Arial" font-size="20" fill="#fff">🎵</text>
      <text x="40" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#ecf0f1">Аудио</text>
      <text x="40" y="55" text-anchor="middle" font-family="Arial" font-size="8" fill="#95a5a6">Bose</text>
    </g>
    
    <g transform="translate(90, 0)">
      <rect x="0" y="0" width="80" height="60" rx="8" fill="#3498db"/>
      <text x="40" y="25" text-anchor="middle" font-family="Arial" font-size="20" fill="#fff">🛡️</text>
      <text x="40" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#ecf0f1">Защита</text>
      <text x="40" y="55" text-anchor="middle" font-family="Arial" font-size="8" fill="#95a5a6">Сигнализация</text>
    </g>
    
    <g transform="translate(180, 0)">
      <rect x="0" y="0" width="80" height="60" rx="8" fill="#27ae60"/>
      <text x="40" y="25" text-anchor="middle" font-family="Arial" font-size="20" fill="#fff">🌡️</text>
      <text x="40" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#ecf0f1">Подогрев</text>
      <text x="40" y="55" text-anchor="middle" font-family="Arial" font-size="8" fill="#95a5a6">Сиденья</text>
    </g>
    
    <g transform="translate(270, 0)">
      <rect x="0" y="0" width="80" height="60" rx="8" fill="#f39c12"/>
      <text x="40" y="25" text-anchor="middle" font-family="Arial" font-size="20" fill="#fff">🅿️</text>
      <text x="40" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#ecf0f1">Парктроник</text>
      <text x="40" y="55" text-anchor="middle" font-family="Arial" font-size="8" fill="#95a5a6">Датчики</text>
    </g>
    
    <!-- Row 2 -->
    <g transform="translate(0, 70)">
      <rect x="0" y="0" width="80" height="60" rx="8" fill="#9b59b6"/>
      <text x="40" y="25" text-anchor="middle" font-family="Arial" font-size="20" fill="#fff">🗺️</text>
      <text x="40" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#ecf0f1">Навигация</text>
      <text x="40" y="55" text-anchor="middle" font-family="Arial" font-size="8" fill="#95a5a6">GPS</text>
    </g>
    
    <g transform="translate(90, 70)">
      <rect x="0" y="0" width="80" height="60" rx="8" fill="#1abc9c"/>
      <text x="40" y="25" text-anchor="middle" font-family="Arial" font-size="20" fill="#fff">📱</text>
      <text x="40" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#ecf0f1">Bluetooth</text>
      <text x="40" y="55" text-anchor="middle" font-family="Arial" font-size="8" fill="#95a5a6">Hands-free</text>
    </g>
    
    <g transform="translate(180, 70)">
      <rect x="0" y="0" width="80" height="60" rx="8" fill="#34495e"/>
      <text x="40" y="25" text-anchor="middle" font-family="Arial" font-size="20" fill="#fff">🧹</text>
      <text x="40" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#ecf0f1">Уход</text>
      <text x="40" y="55" text-anchor="middle" font-family="Arial" font-size="8" fill="#95a5a6">Наборы</text>
    </g>
    
    <g transform="translate(270, 70)">
      <rect x="0" y="0" width="80" height="60" rx="8" fill="#c0392b"/>
      <text x="40" y="25" text-anchor="middle" font-family="Arial" font-size="20" fill="#fff">🔒</text>
      <text x="40" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#ecf0f1">Замки</text>
      <text x="40" y="55" text-anchor="middle" font-family="Arial" font-size="8" fill="#95a5a6">Блокираторы</text>
    </g>
  </g>
  
  <!-- Bottom info -->
  <g transform="translate(50, 340)">
    <rect x="0" y="0" width="700" height="40" rx="8" fill="#34495e"/>
    <text x="350" y="25" text-anchor="middle" font-family="Arial" font-size="12" fill="#bdc3c7">Где купить: Официальные дилеры • Mazda Parts Online • Разборки • eBay</text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="750" cy="350" r="40" fill="#e74c3c" opacity="0.1"/>
  <circle cx="770" cy="370" r="20" fill="#3498db" opacity="0.2"/>
</svg>
