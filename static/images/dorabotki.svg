<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="turboGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Turbocharger icon -->
  <g transform="translate(150, 100)">
    <circle cx="60" cy="80" r="50" fill="url(#turboGradient)"/>
    <circle cx="60" cy="80" r="35" fill="#34495e"/>
    <circle cx="60" cy="80" r="20" fill="#e74c3c"/>
    <path d="M60 50 L60 110 M30 80 L90 80" stroke="#ecf0f1" stroke-width="4"/>
    
    <!-- Pipes -->
    <path d="M110 80 L160 80 L160 50" stroke="#7f8c8d" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M10 80 L-40 80 L-40 100" stroke="#7f8c8d" stroke-width="12" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Text -->
  <text x="450" y="80" font-family="Arial" font-size="42" font-weight="bold" fill="#ecf0f1">ДОРАБОТКИ</text>
  <text x="450" y="120" font-family="Arial" font-size="20" fill="#bdc3c7">Stage 1–4 • Турбо • Прошивка</text>
  
  <!-- Stage boxes -->
  <g transform="translate(450, 160)">
    <rect x="0" y="0" width="130" height="50" rx="8" fill="#27ae60"/>
    <text x="65" y="25" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">Stage 1</text>
    <text x="65" y="40" text-anchor="middle" font-family="Arial" font-size="9" fill="#ecf0f1">Впуск/Выхлоп</text>
    
    <rect x="145" y="0" width="130" height="50" rx="8" fill="#3498db"/>
    <text x="210" y="25" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">Stage 2</text>
    <text x="210" y="40" text-anchor="middle" font-family="Arial" font-size="9" fill="#ecf0f1">Прошивка ЭБУ</text>
    
    <rect x="0" y="60" width="130" height="50" rx="8" fill="#f39c12"/>
    <text x="65" y="85" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#2c3e50">Stage 3</text>
    <text x="65" y="100" text-anchor="middle" font-family="Arial" font-size="9" fill="#ecf0f1">Внутренности</text>
    
    <rect x="145" y="60" width="130" height="50" rx="8" fill="#e74c3c"/>
    <text x="210" y="85" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">Stage 4</text>
    <text x="210" y="100" text-anchor="middle" font-family="Arial" font-size="9" fill="#ecf0f1">Турбо/Компрессор</text>
  </g>
  
  <!-- Power graph -->
  <g transform="translate(450, 250)">
    <line x1="0" y1="100" x2="300" y2="100" stroke="#7f8c8d" stroke-width="2"/>
    <line x1="0" y1="100" x2="0" y2="0" stroke="#7f8c8d" stroke-width="2"/>
    
    <rect x="20" y="80" width="40" height="20" fill="#27ae60"/>
    <text x="40" y="95" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff">231</text>
    
    <rect x="80" y="70" width="40" height="30" fill="#3498db"/>
    <text x="100" y="90" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff">265</text>
    
    <rect x="140" y="55" width="40" height="45" fill="#f39c12"/>
    <text x="160" y="80" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff">300</text>
    
    <rect x="200" y="20" width="40" height="80" fill="#e74c3c"/>
    <text x="220" y="65" text-anchor="middle" font-family="Arial" font-size="8" fill="#fff">400</text>
    
    <text x="150" y="120" text-anchor="middle" font-family="Arial" font-size="10" fill="#bdc3c7">Мощность (л.с.)</text>
  </g>
  
  <!-- Warning -->
  <g transform="translate(680, 300)">
    <text x="0" y="0" font-family="Arial" font-size="11" fill="#e74c3c">⚠️ Снижение ресурса!</text>
  </g>
</svg>
