<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="sparkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f1c40f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f39c12;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Spark plug -->
  <g transform="translate(150, 80)">
    <!-- Ceramic -->
    <rect x="30" y="0" width="40" height="80" rx="5" fill="#ecf0f1"/>
    <rect x="35" y="10" width="30" height="60" rx="3" fill="#bdc3c7"/>
    
    <!-- Metal body -->
    <rect x="20" y="80" width="60" height="60" rx="5" fill="#7f8c8d"/>
    <rect x="25" y="90" width="50" height="40" rx="3" fill="#95a5a6"/>
    
    <!-- Thread -->
    <line x1="30" y1="100" x2="70" y2="100" stroke="#7f8c8d" stroke-width="2"/>
    <line x1="30" y1="108" x2="70" y2="108" stroke="#7f8c8d" stroke-width="2"/>
    <line x1="30" y1="116" x2="70" y2="116" stroke="#7f8c8d" stroke-width="2"/>
    
    <!-- Electrode -->
    <rect x="45" y="140" width="10" height="20" fill="#34495e"/>
    <path d="M50 140 L50 155 L65 155" stroke="#e74c3c" stroke-width="4" fill="none" stroke-linecap="round"/>
    
    <!-- Spark -->
    <path d="M50 155 L55 150 L50 145 L55 140" stroke="url(#sparkGradient)" stroke-width="3" fill="none"/>
    <circle cx="50" cy="145" r="5" fill="url(#sparkGradient)" opacity="0.6"/>
  </g>
  
  <!-- Ignition coil -->
  <g transform="translate(300, 120)">
    <rect x="0" y="0" width="70" height="100" rx="8" fill="#2c3e50"/>
    <rect x="10" y="10" width="50" height="60" rx="5" fill="#34495e"/>
    <circle cx="35" cy="85" r="10" fill="#e74c3c"/>
    <line x1="35" y1="75" x2="35" y2="95" stroke="#ecf0f1" stroke-width="2"/>
  </g>
  
  <!-- Text -->
  <text x="450" y="80" font-family="Arial" font-size="42" font-weight="bold" fill="#ecf0f1">СВЕЧИ</text>
  <text x="450" y="120" font-family="Arial" font-size="24" fill="#bdc3c7">И катушки зажигания</text>
  
  <!-- Specs table -->
  <g transform="translate(450, 160)">
    <rect x="0" y="0" width="300" height="100" rx="10" fill="#34495e"/>
    
    <rect x="10" y="10" width="280" height="25" rx="5" fill="#2c3e50"/>
    <text x="20" y="27" font-family="Arial" font-size="11" fill="#bdc3c7">Тип:</text>
    <text x="100" y="27" font-family="Arial" font-size="11" font-weight="bold" fill="#ecf0f1">Иридиевые</text>
    
    <rect x="10" y="40" width="280" height="25" rx="5" fill="#2c3e50"/>
    <text x="20" y="57" font-family="Arial" font-size="11" fill="#bdc3c7">Зазор:</text>
    <text x="100" y="57" font-family="Arial" font-size="11" font-weight="bold" fill="#ecf0f1">1.1 мм</text>
    
    <rect x="10" y="70" width="280" height="25" rx="5" fill="#2c3e50"/>
    <text x="20" y="87" font-family="Arial" font-size="11" fill="#bdc3c7">Замена:</text>
    <text x="100" y="87" font-family="Arial" font-size="11" font-weight="bold" fill="#ecf0f1">60 000 км</text>
  </g>
  
  <!-- OEM info -->
  <g transform="translate(450, 280)">
    <rect x="0" y="0" width="140" height="50" rx="8" fill="#e74c3c"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#fff">OEM:</text>
    <text x="70" y="42" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">NGK LZFR5AJ-11</text>
    
    <rect x="155" y="0" width="140" height="50" rx="8" fill="#3498db"/>
    <text x="225" y="25" text-anchor="middle" font-family="Arial" font-size="10" fill="#fff">Аналог:</text>
    <text x="225" y="42" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">Denso VKH20</text>
  </g>
  
  <!-- Warning -->
  <g transform="translate(650, 350)">
    <text x="0" y="0" font-family="Arial" font-size="10" fill="#f39c12">⚠️ Не перетягивать!</text>
  </g>
</svg>
