<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="docGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Document stack -->
  <g transform="translate(200, 80)">
    <!-- Back document -->
    <rect x="20" y="20" width="180" height="220" rx="5" fill="#2980b9"/>
    <rect x="35" y="35" width="150" height="15" rx="2" fill="#ecf0f1" opacity="0.3"/>
    <rect x="35" y="60" width="130" height="8" rx="2" fill="#ecf0f1" opacity="0.3"/>
    <rect x="35" y="75" width="140" height="8" rx="2" fill="#ecf0f1" opacity="0.3"/>
    
    <!-- Middle document -->
    <rect x="10" y="10" width="180" height="220" rx="5" fill="#3498db"/>
    <rect x="25" y="25" width="150" height="15" rx="2" fill="#ecf0f1" opacity="0.4"/>
    <rect x="25" y="50" width="130" height="8" rx="2" fill="#ecf0f1" opacity="0.4"/>
    <rect x="25" y="65" width="140" height="8" rx="2" fill="#ecf0f1" opacity="0.4"/>
    
    <!-- Front document -->
    <rect x="0" y="0" width="180" height="220" rx="5" fill="url(#docGradient)"/>
    <rect x="20" y="20" width="140" height="20" rx="3" fill="#ecf0f1"/>
    <line x1="20" y1="55" x2="160" y2="55" stroke="#ecf0f1" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="75" x2="140" y2="75" stroke="#ecf0f1" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="95" x2="150" y2="95" stroke="#ecf0f1" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="115" x2="130" y2="115" stroke="#ecf0f1" stroke-width="3" stroke-linecap="round"/>
    <line x1="20" y1="135" x2="145" y2="135" stroke="#ecf0f1" stroke-width="3" stroke-linecap="round"/>
    
    <!-- PDF badge -->
    <rect x="50" y="160" width="80" height="30" rx="5" fill="#e74c3c"/>
    <text x="90" y="180" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#fff">PDF</text>
  </g>
  
  <!-- Text -->
  <text x="450" y="120" font-family="Arial" font-size="42" font-weight="bold" fill="#ecf0f1">ДОКУМЕНТАЦИЯ</text>
  <text x="450" y="165" font-family="Arial" font-size="22" fill="#bdc3c7">Руководства и мануалы</text>
  
  <!-- Icons row -->
  <g transform="translate(450, 220)">
    <!-- Book icon -->
    <rect x="0" y="0" width="60" height="50" rx="5" fill="#3498db"/>
    <line x1="15" y1="10" x2="45" y2="10" stroke="#ecf0f1" stroke-width="2"/>
    <line x1="15" y1="20" x2="45" y2="20" stroke="#ecf0f1" stroke-width="2"/>
    <line x1="15" y1="30" x2="35" y2="30" stroke="#ecf0f1" stroke-width="2"/>
    <text x="30" y="65" text-anchor="middle" font-family="Arial" font-size="12" fill="#bdc3c7">Мануал</text>
    
    <!-- Wrench icon -->
    <rect x="80" y="0" width="60" height="50" rx="5" fill="#e67e22"/>
    <path d="M100 35 L100 20 L110 15" stroke="#ecf0f1" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="110" cy="15" r="6" fill="none" stroke="#ecf0f1" stroke-width="3"/>
    <text x="110" y="65" text-anchor="middle" font-family="Arial" font-size="12" fill="#bdc3c7">Сервис</text>
    
    <!-- Parts icon -->
    <rect x="160" y="0" width="60" height="50" rx="5" fill="#9b59b6"/>
    <circle cx="190" cy="20" r="8" fill="none" stroke="#ecf0f1" stroke-width="3"/>
    <rect x="180" y="30" width="20" height="12" rx="2" fill="#ecf0f1"/>
    <text x="190" y="65" text-anchor="middle" font-family="Arial" font-size="12" fill="#bdc3c7">Запчасти</text>
  </g>
  
  <!-- Download arrow -->
  <g transform="translate(450, 320)">
    <path d="M0 0 L15 15 L30 0" stroke="#27ae60" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="15" y1="0" x2="15" y2="20" stroke="#27ae60" stroke-width="4" stroke-linecap="round"/>
    <text x="40" y="18" font-family="Arial" font-size="14" fill="#27ae60">Скачать</text>
  </g>
</svg>
