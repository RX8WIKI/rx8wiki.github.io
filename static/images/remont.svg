<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="toolGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d35400;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Engine block outline -->
  <g transform="translate(100, 80)">
    <rect x="0" y="0" width="200" height="180" rx="15" fill="#34495e" opacity="0.7"/>
    <rect x="20" y="20" width="160" height="140" rx="10" fill="#2c3e50"/>
    
    <!-- Rotor hint -->
    <path d="M100 40 L140 110 L60 110 Z" fill="#e74c3c" opacity="0.5"/>
    <circle cx="100" cy="85" r="15" fill="#c0392b"/>
    
    <!-- Bolts -->
    <circle cx="40" cy="40" r="8" fill="#7f8c8d"/>
    <circle cx="160" cy="40" r="8" fill="#7f8c8d"/>
    <circle cx="40" cy="140" r="8" fill="#7f8c8d"/>
    <circle cx="160" cy="140" r="8" fill="#7f8c8d"/>
  </g>
  
  <!-- Wrench -->
  <g transform="translate(350, 100)">
    <path d="M0 20 L30 20 L35 15 L45 25 L35 35 L30 30 L0 30 Z" fill="url(#toolGradient)"/>
    <circle cx="55" cy="20" r="12" fill="none" stroke="url(#toolGradient)" stroke-width="8"/>
    <rect x="48" y="15" width="14" height="10" fill="#2c3e50"/>
  </g>
  
  <!-- Screwdriver -->
  <g transform="translate(350, 180)">
    <rect x="0" y="10" width="80" height="8" rx="3" fill="url(#toolGradient)"/>
    <rect x="80" y="5" width="20" height="18" rx="3" fill="#2c3e50"/>
    <polygon points="0,14 -5,10 -5,18" fill="#7f8c8d"/>
  </g>
  
  <!-- Text -->
  <text x="450" y="80" font-family="Arial" font-size="42" font-weight="bold" fill="#ecf0f1">РЕМОНТ</text>
  <text x="450" y="120" font-family="Arial" font-size="24" fill="#bdc3c7">Переборка двигателя</text>
  
  <!-- Steps -->
  <g transform="translate(450, 160)">
    <rect x="0" y="0" width="300" height="100" rx="10" fill="#34495e"/>
    
    <circle cx="20" cy="25" r="12" fill="#e74c3c"/>
    <text x="20" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">1</text>
    <text x="45" y="30" font-family="Arial" font-size="12" fill="#ecf0f1">Демонтаж</text>
    
    <circle cx="20" cy="50" r="12" fill="#f39c12"/>
    <text x="20" y="55" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50">2</text>
    <text x="45" y="55" font-family="Arial" font-size="12" fill="#ecf0f1">Разборка</text>
    
    <circle cx="20" cy="75" r="12" fill="#3498db"/>
    <text x="20" y="80" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">3</text>
    <text x="45" y="80" font-family="Arial" font-size="12" fill="#ecf0f1">Дефектовка</text>
    
    <circle cx="170" cy="25" r="12" fill="#27ae60"/>
    <text x="170" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">4</text>
    <text x="195" y="30" font-family="Arial" font-size="12" fill="#ecf0f1">Замена уплотнений</text>
    
    <circle cx="170" cy="50" r="12" fill="#9b59b6"/>
    <text x="170" y="55" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">5</text>
    <text x="195" y="55" font-family="Arial" font-size="12" fill="#ecf0f1">Сборка</text>
    
    <circle cx="170" cy="75" r="12" fill="#e67e22"/>
    <text x="170" y="80" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">6</text>
    <text x="195" y="80" font-family="Arial" font-size="12" fill="#ecf0f1">Обкатка</text>
  </g>
  
  <!-- Cost hint -->
  <g transform="translate(450, 280)">
    <rect x="0" y="0" width="140" height="40" rx="8" fill="#2c3e50"/>
    <text x="70" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#bdc3c7">Малая:</text>
    <text x="70" y="35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#27ae60">$1500–2500</text>
    
    <rect x="155" y="0" width="140" height="40" rx="8" fill="#2c3e50"/>
    <text x="225" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#bdc3c7">Полная:</text>
    <text x="225" y="35" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#e74c3c">$3000–4500</text>
  </g>
</svg>
