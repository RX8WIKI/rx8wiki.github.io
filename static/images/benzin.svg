<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="fuelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Fuel pump icon -->
  <g transform="translate(250, 80)">
    <rect x="0" y="0" width="120" height="180" rx="10" fill="url(#fuelGradient)"/>
    <rect x="15" y="20" width="90" height="60" rx="5" fill="#ecf0f1"/>
    <text x="60" y="55" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#2c3e50">95</text>
    <rect x="130" y="40" width="15" height="80" rx="3" fill="#e74c3c"/>
    <path d="M145 80 L180 80 L180 100 L160 100" stroke="#e74c3c" stroke-width="8" fill="none" stroke-linecap="round"/>
    <circle cx="160" cy="100" r="8" fill="#e74c3c"/>
  </g>
  
  <!-- Fuel drops -->
  <circle cx="200" cy="320" r="15" fill="#e74c3c" opacity="0.8"/>
  <circle cx="240" cy="340" r="10" fill="#e74c3c" opacity="0.6"/>
  <circle cx="280" cy="310" r="12" fill="#e74c3c" opacity="0.7"/>
  
  <!-- Text -->
  <text x="450" y="140" font-family="Arial" font-size="48" font-weight="bold" fill="#ecf0f1">БЕНЗИН</text>
  <text x="450" y="190" font-family="Arial" font-size="24" fill="#bdc3c7">Октановое число</text>
  
  <!-- Octane ratings -->
  <g transform="translate(450, 230)">
    <rect x="0" y="0" width="100" height="50" rx="8" fill="#e74c3c"/>
    <text x="50" y="32" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#fff">АИ-92</text>
    
    <rect x="120" y="0" width="100" height="50" rx="8" fill="#27ae60"/>
    <text x="170" y="32" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#fff">АИ-95</text>
    
    <rect x="240" y="0" width="100" height="50" rx="8" fill="#f39c12"/>
    <text x="290" y="32" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#fff">АИ-98</text>
  </g>
  
  <!-- RX-8 silhouette hint -->
  <path d="M500 340 L650 340 L640 320 L620 300 L580 290 L520 290 L480 300 L460 320 Z" fill="#34495e" opacity="0.5"/>
</svg>
