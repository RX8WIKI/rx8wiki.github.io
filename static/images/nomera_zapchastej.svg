<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="boxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Parts boxes -->
  <g transform="translate(80, 100)">
    <!-- Oil filter box -->
    <rect x="0" y="0" width="90" height="100" rx="5" fill="url(#boxGradient)"/>
    <rect x="10" y="10" width="70" height="50" rx="3" fill="#ecf0f1"/>
    <text x="45" y="35" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2c3e50">OIL</text>
    <text x="45" y="48" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2c3e50">FILTER</text>
    <text x="45" y="70" text-anchor="middle" font-family="Arial" font-size="8" fill="#ecf0f1">N3Y1-14-302</text>
    <text x="45" y="85" text-anchor="middle" font-family="Arial" font-size="7" fill="#95a5a6">MANN W610/6</text>
  </g>
  
  <g transform="translate(190, 100)">
    <!-- Air filter box -->
    <rect x="0" y="0" width="90" height="100" rx="5" fill="#3498db"/>
    <rect x="10" y="10" width="70" height="50" rx="3" fill="#ecf0f1"/>
    <text x="45" y="35" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2c3e50">AIR</text>
    <text x="45" y="48" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2c3e50">FILTER</text>
    <text x="45" y="70" text-anchor="middle" font-family="Arial" font-size="8" fill="#ecf0f1">N3Y1-13-Z40</text>
    <text x="45" y="85" text-anchor="middle" font-family="Arial" font-size="7" fill="#95a5a6">MANN C29003</text>
  </g>
  
  <g transform="translate(300, 100)">
    <!-- Spark plug box -->
    <rect x="0" y="0" width="90" height="100" rx="5" fill="#9b59b6"/>
    <rect x="10" y="10" width="70" height="50" rx="3" fill="#ecf0f1"/>
    <text x="45" y="35" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2c3e50">SPARK</text>
    <text x="45" y="48" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2c3e50">PLUG</text>
    <text x="45" y="70" text-anchor="middle" font-family="Arial" font-size="8" fill="#ecf0f1">NGK LZFR5AJ-11</text>
    <text x="45" y="85" text-anchor="middle" font-family="Arial" font-size="7" fill="#95a5a6">Иридиевые</text>
  </g>
  
  <g transform="translate(410, 100)">
    <!-- Brake pads box -->
    <rect x="0" y="0" width="90" height="100" rx="5" fill="#27ae60"/>
    <rect x="10" y="10" width="70" height="50" rx="3" fill="#ecf0f1"/>
    <text x="45" y="35" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2c3e50">BRAKE</text>
    <text x="45" y="48" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2c3e50">PADS</text>
    <text x="45" y="70" text-anchor="middle" font-family="Arial" font-size="8" fill="#ecf0f1">D2060-13-Z10</text>
    <text x="45" y="85" text-anchor="middle" font-family="Arial" font-size="7" fill="#95a5a6">Akebono AN-805K</text>
  </g>
  
  <g transform="translate(520, 100)">
    <!-- Cabin filter box -->
    <rect x="0" y="0" width="90" height="100" rx="5" fill="#f39c12"/>
    <rect x="10" y="10" width="70" height="50" rx="3" fill="#ecf0f1"/>
    <text x="45" y="35" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2c3e50">CABIN</text>
    <text x="45" y="48" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2c3e50">FILTER</text>
    <text x="45" y="70" text-anchor="middle" font-family="Arial" font-size="8" fill="#ecf0f1">N3Y1-61-J6X</text>
    <text x="45" y="85" text-anchor="middle" font-family="Arial" font-size="7" fill="#95a5a6">MANN CU2941</text>
  </g>
  
  <g transform="translate(630, 100)">
    <!-- Coil pack box -->
    <rect x="0" y="0" width="90" height="100" rx="5" fill="#e67e22"/>
    <rect x="10" y="10" width="70" height="50" rx="3" fill="#ecf0f1"/>
    <text x="45" y="35" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2c3e50">IGNITION</text>
    <text x="45" y="48" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#2c3e50">COIL</text>
    <text x="45" y="70" text-anchor="middle" font-family="Arial" font-size="8" fill="#ecf0f1">N3Y1-18-100</text>
    <text x="45" y="85" text-anchor="middle" font-family="Arial" font-size="7" fill="#95a5a6">Denso DC-10001</text>
  </g>
  
  <!-- Text -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="42" font-weight="bold" fill="#ecf0f1">ЗАПЧАСТИ</text>
  <text x="400" y="80" text-anchor="middle" font-family="Arial" font-size="18" fill="#bdc3c7">Оригинал ↔ Заменители</text>
  
  <!-- Comparison table -->
  <g transform="translate(100, 240)">
    <rect x="0" y="0" width="600" height="120" rx="10" fill="#34495e"/>
    
    <!-- Header -->
    <rect x="10" y="10" width="580" height="30" rx="5" fill="#2c3e50"/>
    <text x="100" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="#ecf0f1">КАТЕГОРИЯ</text>
    <text x="300" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="#e74c3c">ОРИГИНАЛ</text>
    <text x="500" y="30" font-family="Arial" font-size="12" font-weight="bold" fill="#27ae60">ЗАМЕНИТЕЛЬ</text>
    
    <!-- Row 1 -->
    <line x1="10" y1="50" x2="590" y2="50" stroke="#4a5568" stroke-width="1"/>
    <text x="100" y="65" font-family="Arial" font-size="11" fill="#bdc3c7">Масляный фильтр</text>
    <text x="300" y="65" font-family="Arial" font-size="11" fill="#e74c3c">N3Y1-14-302</text>
    <text x="500" y="65" font-family="Arial" font-size="11" fill="#27ae60">MANN W610/6</text>
    
    <!-- Row 2 -->
    <line x1="10" y1="75" x2="590" y2="75" stroke="#4a5568" stroke-width="1"/>
    <text x="100" y="90" font-family="Arial" font-size="11" fill="#bdc3c7">Воздушный фильтр</text>
    <text x="300" y="90" font-family="Arial" font-size="11" fill="#e74c3c">N3Y1-13-Z40</text>
    <text x="500" y="90" font-family="Arial" font-size="11" fill="#27ae60">MANN C29003</text>
    
    <!-- Row 3 -->
    <line x1="10" y1="100" x2="590" y2="100" stroke="#4a5568" stroke-width="1"/>
    <text x="100" y="115" font-family="Arial" font-size="11" fill="#bdc3c7">Свечи зажигания</text>
    <text x="300" y="115" font-family="Arial" font-size="11" fill="#e74c3c">NGK LZFR5AJ-11</text>
    <text x="500" y="115" font-family="Arial" font-size="11" fill="#27ae60">Denso VKH20</text>
  </g>
  
  <!-- Brands logos hint -->
  <g transform="translate(100, 370)">
    <text x="0" y="0" font-family="Arial" font-size="10" fill="#7f8c8d">Бренды: MANN • Knecht • NGK • Denso • Bosch • TRW • Akebono • Lemförder</text>
  </g>
</svg>
