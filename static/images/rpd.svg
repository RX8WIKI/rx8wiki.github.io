<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="rotorGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Rotor shape -->
  <g transform="translate(200, 200)">
    <!-- Housing outline -->
    <path d="M0 -100 Q50 -120 100 -100 Q150 -80 150 0 Q150 80 100 100 Q50 120 0 100 Q-50 120 -100 100 Q-150 80 -150 0 Q-150 -80 -100 -100 Q-50 -120 0 -100" 
          fill="none" stroke="#7f8c8d" stroke-width="3" stroke-dasharray="5,5"/>
    
    <!-- Rotor -->
    <path d="M-70 -40 Q0 -80 70 -40 Q80 0 70 40 Q0 80 -70 40 Q-80 0 -70 -40" 
          fill="url(#rotorGradient)"/>
    
    <!-- Apex seals -->
    <circle cx="0" cy="-75" r="8" fill="#34495e"/>
    <circle cx="65" cy="38" r="8" fill="#34495e"/>
    <circle cx="-65" cy="38" r="8" fill="#34495e"/>
    
    <!-- Center -->
    <circle cx="0" cy="0" r="15" fill="#2c3e50"/>
    <circle cx="0" cy="0" r="8" fill="#e74c3c"/>
    
    <!-- Eccentric shaft hint -->
    <rect x="-10" y="0" width="20" height="60" fill="#7f8c8d"/>
  </g>
  
  <!-- Text -->
  <text x="450" y="60" font-family="Arial" font-size="42" font-weight="bold" fill="#ecf0f1">РПД</text>
  <text x="450" y="100" font-family="Arial" font-size="20" fill="#bdc3c7">Роторно-Поршневой Двигатель</text>
  
  <!-- Specs -->
  <g transform="translate(450, 140)">
    <rect x="0" y="0" width="300" height="120" rx="10" fill="#34495e"/>
    
    <rect x="10" y="10" width="280" height="25" rx="5" fill="#2c3e50"/>
    <text x="20" y="27" font-family="Arial" font-size="11" fill="#bdc3c7">Тип:</text>
    <text x="100" y="27" font-family="Arial" font-size="11" font-weight="bold" fill="#ecf0f1">2-роторный, 13B-MSP</text>
    
    <rect x="10" y="40" width="280" height="25" rx="5" fill="#2c3e50"/>
    <text x="20" y="57" font-family="Arial" font-size="11" fill="#bdc3c7">Объём:</text>
    <text x="100" y="57" font-family="Arial" font-size="11" font-weight="bold" fill="#ecf0f1">1.3 л (654cc × 2)</text>
    
    <rect x="10" y="70" width="280" height="25" rx="5" fill="#2c3e50"/>
    <text x="20" y="87" font-family="Arial" font-size="11" fill="#bdc3c7">Мощность:</text>
    <text x="100" y="87" font-family="Arial" font-size="11" font-weight="bold" fill="#ecf0f1">192 / 231 л.с.</text>
    
    <rect x="10" y="100" width="280" height="25" rx="5" fill="#2c3e50"/>
    <text x="20" y="117" font-family="Arial" font-size="11" fill="#bdc3c7">Свечи:</text>
    <text x="100" y="117" font-family="Arial" font-size="11" font-weight="bold" fill="#ecf0f1">4 шт. на двигатель</text>
  </g>
  
  <!-- 4-stroke cycle -->
  <g transform="translate(450, 280)">
    <text x="0" y="0" font-family="Arial" font-size="11" font-weight="bold" fill="#bdc3c7">4 такта:</text>
    
    <circle cx="30" cy="20" r="15" fill="#3498db"/>
    <text x="30" y="25" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">Впуск</text>
    
    <circle cx="80" cy="20" r="15" fill="#9b59b6"/>
    <text x="80" y="25" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">Сжатие</text>
    
    <circle cx="130" cy="20" r="15" fill="#e74c3c"/>
    <text x="130" y="25" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">Рабочий</text>
    
    <circle cx="180" cy="20" r="15" fill="#27ae60"/>
    <text x="180" y="25" text-anchor="middle" font-family="Arial" font-size="9" fill="#fff">Выпуск</text>
    
    <text x="220" y="25" font-family="Arial" font-size="10" fill="#bdc3c7">— пространственно разделены</text>
  </g>
  
  <!-- Felix Wankel reference -->
  <g transform="translate(450, 350)">
    <text x="0" y="0" font-family="Arial" font-size="10" fill="#95a5a6">Изобретатель: Феликс Ванкель (1957)</text>
  </g>
</svg>
