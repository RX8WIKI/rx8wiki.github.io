<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="fuelGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Fuel tank -->
  <g transform="translate(80, 100)">
    <ellipse cx="80" cy="60" rx="80" ry="50" fill="url(#fuelGradient)"/>
    <rect x="0" y="60" width="160" height="80" fill="url(#fuelGradient)"/>
    <ellipse cx="80" cy="140" rx="80" ry="50" fill="url(#fuelGradient)"/>
    
    <!-- Fuel level -->
    <ellipse cx="80" cy="130" rx="70" ry="40" fill="#2980b9" opacity="0.5"/>
    
    <!-- Fuel pump -->
    <rect x="60" y="20" width="40" height="50" rx="5" fill="#34495e"/>
    <circle cx="80" cy="45" r="15" fill="#2c3e50"/>
    
    <!-- Pipe out -->
    <path d="M80 20 L80 -20 L120 -20" stroke="#7f8c8d" stroke-width="8" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Fuel rail -->
  <g transform="translate(300, 80)">
    <rect x="0" y="0" width="180" height="40" rx="10" fill="#7f8c8d"/>
    
    <!-- Injectors -->
    <rect x="20" y="40" width="25" height="50" rx="3" fill="#34495e"/>
    <rect x="65" y="40" width="25" height="50" rx="3" fill="#34495e"/>
    <rect x="110" y="40" width="25" height="50" rx="3" fill="#34495e"/>
    <rect x="155" y="40" width="25" height="50" rx="3" fill="#34495e"/>
    
    <!-- Pressure regulator -->
    <circle cx="170" cy="20" r="12" fill="#e74c3c"/>
  </g>
  
  <!-- Connecting pipe -->
  <path d="M240 60 L280 60 L280 100" stroke="#7f8c8d" stroke-width="8" fill="none" stroke-linecap="round"/>
  
  <!-- Text -->
  <text x="450" y="60" font-family="Arial" font-size="42" font-weight="bold" fill="#ecf0f1">ТОПЛИВНАЯ</text>
  <text x="450" y="95" font-family="Arial" font-size="24" fill="#3498db">СИСТЕМА</text>
  
  <!-- Specs -->
  <g transform="translate(450, 130)">
    <rect x="0" y="0" width="300" height="100" rx="10" fill="#34495e"/>
    
    <rect x="10" y="10" width="280" height="25" rx="5" fill="#2c3e50"/>
    <text x="20" y="27" font-family="Arial" font-size="11" fill="#bdc3c7">Давление:</text>
    <text x="150" y="27" font-family="Arial" font-size="11" font-weight="bold" fill="#3498db">3.5–4.0 бар</text>
    
    <rect x="10" y="40" width="280" height="25" rx="5" fill="#2c3e50"/>
    <text x="20" y="57" font-family="Arial" font-size="11" fill="#bdc3c7">Форсунки:</text>
    <text x="150" y="57" font-family="Arial" font-size="11" font-weight="bold" fill="#3498db">250–280 cc/min</text>
    
    <rect x="10" y="70" width="280" height="25" rx="5" fill="#2c3e50"/>
    <text x="20" y="87" font-family="Arial" font-size="11" fill="#bdc3c7">Бак:</text>
    <text x="150" y="87" font-family="Arial" font-size="11" font-weight="bold" fill="#3498db">59 литров</text>
  </g>
  
  <!-- Components -->
  <g transform="translate(450, 250)">
    <circle cx="15" cy="15" r="10" fill="#e74c3c"/>
    <text x="35" y="20" font-family="Arial" font-size="11" fill="#ecf0f1">Топливный насос</text>
    
    <circle cx="15" cy="45" r="10" fill="#f39c12"/>
    <text x="35" y="50" font-family="Arial" font-size="11" fill="#ecf0f1">Фильтр (в баке)</text>
    
    <circle cx="15" cy="75" r="10" fill="#3498db"/>
    <text x="35" y="80" font-family="Arial" font-size="11" fill="#ecf0f1">Рампа с форсунками</text>
    
    <circle cx="170" cy="15" r="10" fill="#27ae60"/>
    <text x="190" y="20" font-family="Arial" font-size="11" fill="#ecf0f1">Регулятор давления</text>
    
    <circle cx="170" cy="45" r="10" fill="#9b59b6"/>
    <text x="190" y="50" font-family="Arial" font-size="11" fill="#ecf0f1">Обратка в бак</text>
  </g>
  
  <!-- Warning -->
  <g transform="translate(450, 360)">
    <text x="0" y="0" font-family="Arial" font-size="10" fill="#e74c3c">⚠️ Пожароопасно! Работать в проветриваемом помещении</text>
  </g>
</svg>
