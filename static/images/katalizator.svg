<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="catGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e67e22;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#d35400;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Catalytic converter -->
  <g transform="translate(100, 120)">
    <!-- Main body -->
    <rect x="0" y="40" width="280" height="80" rx="15" fill="url(#catGradient)"/>
    
    <!-- Pipes -->
    <rect x="-40" y="55" width="45" height="50" rx="5" fill="#7f8c8d"/>
    <rect x="275" y="55" width="45" height="50" rx="5" fill="#7f8c8d"/>
    
    <!-- Honeycomb structure -->
    <rect x="30" y="50" width="220" height="60" rx="5" fill="#34495e"/>
    <pattern id="honeycomb" x="0" y="0" width="10" height="10" patternUnits="userSpaceOnUse">
      <polygon points="5,0 10,2.5 10,7.5 5,10 0,7.5 0,2.5" fill="#2c3e50"/>
    </pattern>
    <rect x="35" y="55" width="210" height="50" fill="url(#honeycomb)"/>
    
    <!-- Oxygen sensors -->
    <circle cx="80" cy="45" r="8" fill="#e74c3c"/>
    <line x1="80" y1="45" x2="80" y2="25" stroke="#e74c3c" stroke-width="3"/>
    <text x="80" y="20" text-anchor="middle" font-family="Arial" font-size="9" fill="#e74c3c">O2</text>
    
    <circle cx="200" cy="115" r="8" fill="#3498db"/>
    <line x1="200" y1="115" x2="200" y2="135" stroke="#3498db" stroke-width="3"/>
    <text x="200" y="150" text-anchor="middle" font-family="Arial" font-size="9" fill="#3498db">O2</text>
  </g>
  
  <!-- Text -->
  <text x="450" y="60" font-family="Arial" font-size="42" font-weight="bold" fill="#ecf0f1">КАТАЛИЗАТОР</text>
  <text x="450" y="95" font-family="Arial" font-size="20" fill="#bdc3c7">И лямбда-зонды</text>
  
  <!-- Error codes -->
  <g transform="translate(450, 130)">
    <rect x="0" y="0" width="300" height="90" rx="10" fill="#34495e"/>
    
    <rect x="10" y="10" width="280" height="30" rx="5" fill="#e74c3c"/>
    <text x="150" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">P0420 — Низкая эффективность (Банк 1)</text>
    
    <rect x="10" y="45" width="280" height="30" rx="5" fill="#e74c3c"/>
    <text x="150" y="65" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">P0430 — Низкая эффективность (Банк 2)</text>
  </g>
  
  <!-- Lambda info -->
  <g transform="translate(450, 240)">
    <rect x="0" y="0" width="140" height="100" rx="10" fill="#2c3e50"/>
    <text x="70" y="25" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#e74c3c">Upper (A/F)</text>
    <text x="70" y="45" text-anchor="middle" font-family="Arial" font-size="10" fill="#bdc3c7">До катализатора</text>
    <text x="70" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="#bdc3c7">Коррекция смеси</text>
    <text x="70" y="85" text-anchor="middle" font-family="Arial" font-size="10" fill="#95a5a6">Denso DOX-0106</text>
    
    <rect x="155" y="0" width="140" height="100" rx="10" fill="#2c3e50"/>
    <text x="225" y="25" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#3498db">Lower (O2)</text>
    <text x="225" y="45" text-anchor="middle" font-family="Arial" font-size="10" fill="#bdc3c7">После катализатора</text>
    <text x="225" y="65" text-anchor="middle" font-family="Arial" font-size="10" fill="#bdc3c7">Диагностика</text>
    <text x="225" y="85" text-anchor="middle" font-family="Arial" font-size="10" fill="#95a5a6">Denso DOX-0107</text>
  </g>
  
  <!-- Warning -->
  <g transform="translate(550, 360)">
    <text x="0" y="0" font-family="Arial" font-size="10" fill="#f39c12">⚠️ Удаление незаконно!</text>
  </g>
</svg>
