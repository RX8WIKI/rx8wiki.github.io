      <text x="40" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#ecf0f1">51U</text>
      <text x="40" y="93" text-anchor="middle" font-family="Arial" font-size="9" fill="#95a5a6">Velocity Red</text>
    </g>
    
    <g transform="translate(600, 0)">
