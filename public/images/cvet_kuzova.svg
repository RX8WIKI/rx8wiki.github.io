  <!-- VIN plate hint -->
  <g transform="translate(650, 280)">
    <rect x="0" y="0" width="120" height="80" rx="5" fill="#4a5568"/>
    <rect x="10" y="10" width="100" height="60" rx="3" fill="#ecf0f1"/>
    <text x="60" y="30" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#2c3e50">VIN PLATE</text>
    <line x1="15" y1="40" x2="105" y2="40" stroke="#2c3e50" stroke-width="1"/>
    <text x="15" y="55" font-family="Arial" font-size="8" fill="#2c3e50">Color: 62H</text>
    <text x="15" y="65" font-family="Arial" font-size="8" fill="#2c3e50">Year: 2008</text>
  </g>
  
  <!-- Paint can icon -->
  <g transform="translate(50, 280)">
    <path d="M20 20 L60 20 L55 70 L25 70 Z" fill="#e74c3c"/>
    <ellipse cx="40" cy="20" rx="20" ry="8" fill="#c0392b"/>
    <ellipse cx="40" cy="20" rx="15" ry="5" fill="#e74c3c"/>
    <rect x="35" y="35" width="10" height="25" fill="#ecf0f1" opacity="0.3"/>
    <text x="40" y="85" text-anchor="middle" font-family="Arial" font-size="10" fill="#bdc3c7">Подбор</text>
