<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Text -->
  <text x="400" y="50" text-anchor="middle" font-family="Arial" font-size="42" font-weight="bold" fill="#ecf0f1">ЦВЕТА КУЗОВА</text>
  <text x="400" y="80" text-anchor="middle" font-family="Arial" font-size="18" fill="#bdc3c7">Коды краски по годам выпуска</text>
  
  <!-- Color swatches grid -->
  <g transform="translate(100, 110)">
    <!-- Row 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="80" height="60" rx="8" fill="#f5f5f5" stroke="#bdc3c7" stroke-width="2"/>
      <text x="40" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#ecf0f1">10U</text>
      <text x="40" y="93" text-anchor="middle" font-family="Arial" font-size="9" fill="#95a5a6">Arctic White</text>
    </g>
    
    <g transform="translate(100, 0)">
      <rect x="0" y="0" width="80" height="60" rx="8" fill="#95a5a6" stroke="#7f8c8d" stroke-width="2"/>
      <text x="40" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#ecf0f1">35B</text>
      <text x="40" y="93" text-anchor="middle" font-family="Arial" font-size="9" fill="#95a5a6">Titanium Gray</text>
    </g>
    
    <g transform="translate(200, 0)">
