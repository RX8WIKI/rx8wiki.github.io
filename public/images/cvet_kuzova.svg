      <text x="40" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#ecf0f1">54R</text>
      <text x="40" y="93" text-anchor="middle" font-family="Arial" font-size="9" fill="#95a5a6">Sparkling Black</text>
    </g>
    
    <g transform="translate(450, 120)">
      <rect x="0" y="0" width="80" height="60" rx="8" fill="#6b7c93" stroke="#4a5568" stroke-width="2"/>
      <text x="40" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#ecf0f1">75M</text>
      <text x="40" y="93" text-anchor="middle" font-family="Arial" font-size="9" fill="#95a5a6">Dolphin Gray</text>
    </g>
    
