      <text x="40" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#ecf0f1">41B</text>
      <text x="40" y="93" text-anchor="middle" font-family="Arial" font-size="9" fill="#95a5a6">Galaxy Gray</text>
    </g>
    
    <g transform="translate(300, 0)">
      <rect x="0" y="0" width="80" height="60" rx="8" fill="#1a365d" stroke="#2c5282" stroke-width="2"/>
      <text x="40" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#ecf0f1">42M</text>
      <text x="40" y="93" text-anchor="middle" font-family="Arial" font-size="9" fill="#95a5a6">Dark Blue</text>
    </g>
    
    <g transform="translate(400, 0)">
      <rect x="0" y="0" width="80" height="60" rx="8" fill="#2b6cb0" stroke="#2c5282" stroke-width="2"/>
      <text x="40" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#ecf0f1">44G</text>
      <text x="40" y="93" text-anchor="middle" font-family="Arial" font-size="9" fill="#95a5a6">Lightning Blue</text>
