      <rect x="0" y="0" width="80" height="60" rx="8" fill="#276749" stroke="#22543d" stroke-width="2"/>
      <text x="40" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#ecf0f1">87K</text>
      <text x="40" y="93" text-anchor="middle" font-family="Arial" font-size="9" fill="#95a5a6">Nordic Green</text>
    </g>
    
