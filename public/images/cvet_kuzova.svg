      <text x="40" y="80" text-anchor="middle" font-family="Arial" font-size="11" fill="#ecf0f1">47M</text>
      <text x="40" y="93" text-anchor="middle" font-family="Arial" font-size="9" fill="#95a5a6">Stormy Blue</text>
    </g>
    
    <g transform="translate(350, 120)">
