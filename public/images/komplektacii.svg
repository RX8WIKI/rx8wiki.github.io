<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="carGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Car silhouettes in different colors -->
  <g transform="translate(50, 180)">
    <!-- Base model -->
    <path d="M0 60 L20 40 L50 35 L100 35 L130 40 L150 60 L150 80 L0 80 Z" fill="#95a5a6"/>
    <circle cx="30" cy="80" r="15" fill="#2c3e50"/>
    <circle cx="120" cy="80" r="15" fill="#2c3e50"/>
    <circle cx="30" cy="80" r="8" fill="#7f8c8d"/>
    <circle cx="120" cy="80" r="8" fill="#7f8c8d"/>
    <text x="75" y="110" text-anchor="middle" font-family="Arial" font-size="14" fill="#bdc3c7">Standard</text>
  </g>
  
  <g transform="translate(220, 180)">
    <!-- Sport model -->
    <path d="M0 60 L20 40 L50 35 L100 35 L130 40 L150 60 L150 80 L0 80 Z" fill="#3498db"/>
    <circle cx="30" cy="80" r="15" fill="#2c3e50"/>
    <circle cx="120" cy="80" r="15" fill="#2c3e50"/>
    <circle cx="30" cy="80" r="8" fill="#7f8c8d"/>
    <circle cx="120" cy="80" r="8" fill="#7f8c8d"/>
    <path d="M130 38 L145 35 L150 45" fill="#2980b9"/>
    <text x="75" y="110" text-anchor="middle" font-family="Arial" font-size="14" fill="#bdc3c7">Sport</text>
  </g>
  
  <g transform="translate(390, 180)">
    <!-- GT model -->
    <path d="M0 60 L20 40 L50 35 L100 35 L130 40 L150 60 L150 80 L0 80 Z" fill="#f39c12"/>
    <circle cx="30" cy="80" r="15" fill="#2c3e50"/>
    <circle cx="120" cy="80" r="15" fill="#2c3e50"/>
    <circle cx="30" cy="80" r="8" fill="#7f8c8d"/>
    <circle cx="120" cy="80" r="8" fill="#7f8c8d"/>
    <path d="M130 38 L145 35 L150 45" fill="#e67e22"/>
    <rect x="55" y="40" width="40" height="15" fill="#2c3e50" opacity="0.5"/>
    <text x="75" y="110" text-anchor="middle" font-family="Arial" font-size="14" fill="#bdc3c7">Grand Touring</text>
  </g>
  
  <g transform="translate(560, 180)">
    <!-- Special Edition -->
    <path d="M0 60 L20 40 L50 35 L100 35 L130 40 L150 60 L150 80 L0 80 Z" fill="#9b59b6"/>
    <circle cx="30" cy="80" r="15" fill="#2c3e50"/>
    <circle cx="120" cy="80" r="15" fill="#2c3e50"/>
    <circle cx="30" cy="80" r="8" fill="#7f8c8d"/>
    <circle cx="120" cy="80" r="8" fill="#7f8c8d"/>
    <path d="M130 38 L145 35 L150 45" fill="#8e44ad"/>
    <rect x="55" y="40" width="40" height="15" fill="#2c3e50" opacity="0.5"/>
    <rect x="70" y="50" width="10" height="8" fill="#f1c40f"/>
    <text x="75" y="110" text-anchor="middle" font-family="Arial" font-size="14" fill="#bdc3c7">Evolve / SE</text>
  </g>
  
  <!-- Text -->
  <text x="400" y="60" text-anchor="middle" font-family="Arial" font-size="42" font-weight="bold" fill="#ecf0f1">КОМПЛЕКТАЦИИ</text>
  <text x="400" y="95" text-anchor="middle" font-family="Arial" font-size="20" fill="#bdc3c7">US • EU • JP • Special Edition</text>
  
  <!-- Power badges -->
  <g transform="translate(100, 320)">
    <rect x="0" y="0" width="80" height="40" rx="5" fill="#34495e"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#bdc3c7">192 л.с.</text>
    <text x="40" y="33" text-anchor="middle" font-family="Arial" font-size="9" fill="#7f8c8d">Standard</text>
  </g>
  
  <g transform="translate(270, 320)">
    <rect x="0" y="0" width="80" height="40" rx="5" fill="#34495e"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#3498db">231 л.с.</text>
    <text x="40" y="33" text-anchor="middle" font-family="Arial" font-size="9" fill="#7f8c8d">Sport</text>
  </g>
  
  <g transform="translate(440, 320)">
    <rect x="0" y="0" width="80" height="40" rx="5" fill="#34495e"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#f39c12">231 л.с.</text>
    <text x="40" y="33" text-anchor="middle" font-family="Arial" font-size="9" fill="#7f8c8d">GT</text>
  </g>
  
  <g transform="translate(610, 320)">
    <rect x="0" y="0" width="80" height="40" rx="5" fill="#34495e"/>
    <text x="40" y="20" text-anchor="middle" font-family="Arial" font-size="10" fill="#9b59b6">250 л.с.</text>
    <text x="40" y="33" text-anchor="middle" font-family="Arial" font-size="9" fill="#7f8c8d">Type S (JP)</text>
  </g>
  
  <!-- Decorative elements -->
  <circle cx="750" cy="50" r="30" fill="#e74c3c" opacity="0.2"/>
  <circle cx="770" cy="30" r="15" fill="#3498db" opacity="0.3"/>
</svg>
