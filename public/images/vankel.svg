<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="paperGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ecf0f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#bdc3c7;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Portrait frame -->
  <g transform="translate(100, 60)">
    <rect x="0" y="0" width="200" height="260" rx="10" fill="#34495e"/>
    <rect x="10" y="10" width="180" height="240" rx="5" fill="#2c3e50"/>
    
    <!-- Silhouette -->
    <circle cx="90" cy="70" r="40" fill="#7f8c8d"/>
    <path d="M30 140 Q90 100 150 140 L150 230 L30 230 Z" fill="#7f8c8d"/>
    
    <!-- Glasses hint -->
    <line x1="70" y1="65" x2="110" y2="65" stroke="#34495e" stroke-width="3"/>
    <circle cx="75" cy="65" r="8" fill="none" stroke="#34495e" stroke-width="2"/>
    <circle cx="105" cy="65" r="8" fill="none" stroke="#34495e" stroke-width="2"/>
    
    <!-- Name plate -->
    <rect x="20" y="220" width="160" height="25" rx="5" fill="#e74c3c"/>
    <text x="100" y="237" text-anchor="middle" font-family="Arial" font-size="11" font-weight="bold" fill="#fff">Felix Wankel</text>
  </g>
  
  <!-- Document/Patent -->
  <g transform="translate(350, 80)">
    <rect x="0" y="0" width="180" height="220" rx="5" fill="url(#paperGradient)"/>
    
    <!-- Header -->
    <rect x="10" y="10" width="160" height="30" rx="3" fill="#34495e"/>
    <text x="90" y="30" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#fff">PATENT</text>
    
    <!-- Lines -->
    <line x1="20" y1="55" x2="160" y2="55" stroke="#2c3e50" stroke-width="2"/>
    <line x1="20" y1="70" x2="140" y2="70" stroke="#2c3e50" stroke-width="2"/>
    <line x1="20" y1="85" x2="150" y2="85" stroke="#2c3e50" stroke-width="2"/>
    <line x1="20" y1="100" x2="130" y2="100" stroke="#2c3e50" stroke-width="2"/>
    
    <!-- Rotor diagram -->
    <path d="M90 130 L110 165 L70 165 Z" fill="#e74c3c" opacity="0.7"/>
    <circle cx="90" cy="155" r="8" fill="#34495e"/>
    
    <text x="90" y="190" text-anchor="middle" font-family="Arial" font-size="8" fill="#2c3e50">1957</text>
  </g>
  
  <!-- Second document -->
  <g transform="translate(480, 100)">
    <rect x="0" y="0" width="160" height="180" rx="5" fill="url(#paperGradient)"/>
    
    <rect x="10" y="10" width="140" height="25" rx="3" fill="#34495e"/>
    <text x="80" y="27" text-anchor="middle" font-family="Arial" font-size="9" font-weight="bold" fill="#fff">NSU Contract</text>
    
    <line x1="20" y1="50" x2="140" y2="50" stroke="#2c3e50" stroke-width="2"/>
    <line x1="20" y1="65" x2="130" y2="65" stroke="#2c3e50" stroke-width="2"/>
    <line x1="20" y1="80" x2="140" y2="80" stroke="#2c3e50" stroke-width="2"/>
    
    <text x="80" y="110" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#e74c3c">1951</text>
  </g>
  
  <!-- Text -->
  <text x="450" y="50" font-family="Arial" font-size="42" font-weight="bold" fill="#ecf0f1">ФЕЛИКС</text>
  <text x="450" y="85" font-family="Arial" font-size="32" font-weight="bold" fill="#e74c3c">ВАНКЕЛЬ</text>
  
  <!-- Timeline -->
  <g transform="translate(350, 300)">
    <line x1="0" y1="20" x2="400" y2="20" stroke="#7f8c8d" stroke-width="2"/>
    
    <circle cx="20" cy="20" r="8" fill="#e74c3c"/>
    <text x="20" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#bdc3c7">1902</text>
    <text x="20" y="58" text-anchor="middle" font-family="Arial" font-size="8" fill="#95a5a6">Рождение</text>
    
    <circle cx="120" cy="20" r="8" fill="#f39c12"/>
    <text x="120" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#bdc3c7">1951</text>
    <text x="120" y="58" text-anchor="middle" font-family="Arial" font-size="8" fill="#95a5a6">Контракт NSU</text>
    
    <circle cx="220" cy="20" r="8" fill="#3498db"/>
    <text x="220" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#bdc3c7">1957</text>
    <text x="220" y="58" text-anchor="middle" font-family="Arial" font-size="8" fill="#95a5a6">Первый РПД</text>
    
    <circle cx="320" cy="20" r="8" fill="#27ae60"/>
    <text x="320" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#bdc3c7">1967</text>
    <text x="320" y="58" text-anchor="middle" font-family="Arial" font-size="8" fill="#95a5a6">Cosmo Sport</text>
    
    <circle cx="380" cy="20" r="8" fill="#9b59b6"/>
    <text x="380" y="45" text-anchor="middle" font-family="Arial" font-size="9" fill="#bdc3c7">1988</text>
    <text x="380" y="58" text-anchor="middle" font-family="Arial" font-size="8" fill="#95a5a6">Смерть</text>
  </g>
  
  <!-- Quote -->
  <g transform="translate(350, 380)">
    <text x="0" y="0" font-family="Arial" font-size="10" fill="#95a5a6" font-style="italic">"Я не изобретал двигатель. Я лишь нашёл форму, которую Бог забыл нарисовать."</text>
  </g>
</svg>
