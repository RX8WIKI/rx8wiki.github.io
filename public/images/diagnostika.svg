<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="screenGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Diagnostic scanner -->
  <g transform="translate(200, 80)">
    <rect x="0" y="0" width="180" height="240" rx="15" fill="#34495e"/>
    <rect x="10" y="10" width="160" height="180" rx="8" fill="url(#screenGradient)"/>
    
    <!-- Screen content -->
    <rect x="20" y="25" width="140" height="25" rx="3" fill="#e74c3c"/>
    <text x="90" y="42" text-anchor="middle" font-family="Arial" font-size="10" font-weight="bold" fill="#fff">CHECK ENGINE</text>
    
    <rect x="20" y="60" width="140" height="20" rx="3" fill="#ecf0f1" opacity="0.3"/>
    <text x="30" y="74" font-family="Arial" font-size="9" fill="#ecf0f1">P0300 - Misfire</text>
    
    <rect x="20" y="85" width="140" height="20" rx="3" fill="#ecf0f1" opacity="0.3"/>
    <text x="30" y="99" font-family="Arial" font-size="9" fill="#ecf0f1">P0171 - Lean Mix</text>
    
    <rect x="20" y="110" width="140" height="20" rx="3" fill="#ecf0f1" opacity="0.3"/>
    <text x="30" y="124" font-family="Arial" font-size="9" fill="#ecf0f1">P0420 - Catalyst</text>
    
    <!-- Buttons -->
    <circle cx="40" cy="220" r="12" fill="#e74c3c"/>
    <circle cx="90" cy="220" r="12" fill="#27ae60"/>
    <circle cx="140" cy="220" r="12" fill="#f39c12"/>
  </g>
  
  <!-- Engine outline -->
  <g transform="translate(450, 120)">
    <rect x="0" y="0" width="120" height="100" rx="10" fill="#7f8c8d" opacity="0.5"/>
    <circle cx="30" cy="50" r="15" fill="#95a5a6"/>
    <circle cx="90" cy="50" r="15" fill="#95a5a6"/>
    <path d="M20 20 L100 20 L100 80 L20 80 Z" fill="none" stroke="#bdc3c7" stroke-width="2"/>
  </g>
  
  <!-- Text -->
  <text x="400" y="60" text-anchor="middle" font-family="Arial" font-size="42" font-weight="bold" fill="#ecf0f1">ДИАГНОСТИКА</text>
  <text x="400" y="90" text-anchor="middle" font-family="Arial" font-size="18" fill="#bdc3c7">По симптомам и кодам ошибок</text>
  
  <!-- Warning triangle -->
  <g transform="translate(500, 250)">
    <path d="M0 40 L40 -30 L80 40 Z" fill="#f39c12"/>
    <text x="40" y="15" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold" fill="#2c3e50">!</text>
  </g>
  
  <!-- Check list -->
  <g transform="translate(450, 280)">
    <rect x="0" y="0" width="150" height="80" rx="8" fill="#34495e"/>
    <text x="20" y="20" font-family="Arial" font-size="11" fill="#27ae60">✓ Компрессия</text>
    <text x="20" y="40" font-family="Arial" font-size="11" fill="#27ae60">✓ Свечи</text>
    <text x="20" y="60" font-family="Arial" font-size="11" fill="#e74c3c">✗ Катушки</text>
  </g>
</svg>
