<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2c3e50;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a252f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gaugeGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#27ae60;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#f39c12;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e74c3c;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="400" fill="url(#bgGradient)"/>
  
  <!-- Compression gauge -->
  <g transform="translate(200, 100)">
    <circle cx="100" cy="100" r="90" fill="#34495e" stroke="#7f8c8d" stroke-width="8"/>
    <circle cx="100" cy="100" r="75" fill="#2c3e50"/>
    
    <!-- Scale -->
    <path d="M30 100 A70 70 0 0 1 170 100" fill="none" stroke="url(#gaugeGradient)" stroke-width="12" stroke-linecap="round"/>
    
    <!-- Needle -->
    <line x1="100" y1="100" x2="150" y2="50" stroke="#e74c3c" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="100" r="10" fill="#e74c3c"/>
    
    <!-- Labels -->
    <text x="100" y="140" text-anchor="middle" font-family="Arial" font-size="28" font-weight="bold" fill="#ecf0f1">8.2</text>
    <text x="100" y="165" text-anchor="middle" font-family="Arial" font-size="14" fill="#bdc3c7">кгс/см²</text>
    
    <!-- Min/Max -->
    <text x="35" y="110" font-family="Arial" font-size="10" fill="#7f8c8d">0</text>
    <text x="165" y="110" font-family="Arial" font-size="10" fill="#7f8c8d">10</text>
  </g>
  
  <!-- Text -->
  <text x="450" y="80" font-family="Arial" font-size="42" font-weight="bold" fill="#ecf0f1">ЗАМЕР</text>
  <text x="450" y="120" font-family="Arial" font-size="32" font-weight="bold" fill="#3498db">КОМПРЕССИИ</text>
  
  <!-- Norm table -->
  <g transform="translate(450, 160)">
    <rect x="0" y="0" width="300" height="120" rx="10" fill="#34495e"/>
    
    <rect x="10" y="10" width="280" height="30" rx="5" fill="#27ae60"/>
    <text x="150" y="30" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">9.0–10.0 — Отличное</text>
    
    <rect x="10" y="45" width="280" height="30" rx="5" fill="#f39c12"/>
    <text x="150" y="65" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#2c3e50">7.5–9.0 — Рабочее</text>
    
    <rect x="10" y="80" width="280" height="30" rx="5" fill="#e74c3c"/>
    <text x="150" y="100" text-anchor="middle" font-family="Arial" font-size="12" font-weight="bold" fill="#fff">&lt;6.5 — Критическое</text>
  </g>
  
  <!-- Spark plug hole hint -->
  <g transform="translate(450, 300)">
    <circle cx="30" cy="15" r="12" fill="#7f8c8d"/>
    <circle cx="30" cy="15" r="6" fill="#34495e"/>
    <text x="55" y="20" font-family="Arial" font-size="12" fill="#bdc3c7">Через свечные отверстия</text>
  </g>
</svg>
